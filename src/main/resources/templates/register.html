<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="www.thymeleaf.org"
  th:replace="~{ base :: layout(~{::title} , ~{::section} ) }"
>
  <head>
    <meta charset="ISO-8859-1" />
    <title>Register</title>
  </head>
  <body>
    <section>
      <section class="min-vh-100 mt-5" style="background-color: #565353">
        <div class="container py-5 h-100">
          <div class="row d-flex justify-content-center align-items-center">
            <div class="col-lg-10">
              <div
                class="card card-registration my-4"
                style="border-radius: 1rem !important"
              >
                <div class="row g-0">
                  <!-- Left Image Section -->
                  <div class="col-md-6 d-none d-md-block">
                    <img
                      src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img4.webp"
                      alt="Register form"
                      class="img-fluid h-100"
                      style="
                        border-radius: 1rem 0 0 1rem;
                        object-fit: cover;
                        height: 90vh;
                      "
                    />
                  </div>

                  <!-- Right Form Section -->
                  <div class="col-md-6 col-12">
                    <div class="card-body p-md-5 text-black">
                      <h3 class="mb-5 text-uppercase">
                        E-Notes registration form
                      </h3>

                      <!-- Error / Register Messages -->
                      <div class="text-center">
                        <th:block th:if="${session.msg}">
                          <p class="fs-5 text-center text-success">
                            [[${session.msg}]]
                          </p>
                          <th:block
                            th:text="${@userServiceImpl.removeSessionMessage()}"
                          ></th:block>
                        </th:block>
                      </div>
                      <form id="registrationForm" th:action="@{/saveUser}" method="post">
                      <div class="row mt-4">
                        <div class="col-md-6 mb-4 w-100">
                          <div data-mdb-input-init class="form-outline">
                            <input
                              type="text"
                              id="name"
                              name="name"
                              class="form-control form-control-lg"
                              placeholder="Enter Full Name"
                              required
                            />
                            <!-- <label class="form-label" for="name"
                              >Enter Full Name</label
                            > -->
                          </div>
                        </div>
                      </div>

                      <div class="row">
                        <div class="col-md-6 mb-4 w-100">
                          <div data-mdb-input-init class="form-outline">
                            <input
                              name="email"
                              type="email"
                              id="email"
                              class="form-control form-control-lg"
                              placeholder="Enter Email"
                              required
                            />
                            <!-- <label class="form-label" for="email"
                              >Enter Email</label
                            > -->
                          </div>
                        </div>
                      </div>

                      <div class="row">
                        <div class="col-md-6 mb-2 w-100">
                          <div data-mdb-input-init class="form-outline">
                            <input
                              name="address"
                              type="text"
                              id="address"
                              class="form-control form-control-lg"
                              placeholder="Enter Address"
                            />
                            <!-- <label class="form-label" for="address"
                              >Enter Address</label
                            > -->
                          </div>
                        </div>
                      </div>

                      <div
                        class="d-md-flex justify-content-start align-items-center mb-4 py-2"
                      >
                        <h6 class="mb-0 me-1">Gender:</h6>

                        <div class="form-check form-check-inline">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="inlineRadio1"
                            value="Male"
                          />
                          <label class="form-check-label" for="inlineRadio1"
                            >Male</label
                          >
                        </div>
                        <div class="form-check form-check-inline">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="inlineRadio2"
                            value="Female"
                          />
                          <label class="form-check-label" for="inlineRadio2"
                            >Female</label
                          >
                        </div>
                        <div class="form-check form-check-inline">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="gender"
                            id="inlineRadio3"
                            value="Other"
                          />
                          <label class="form-check-label" for="inlineRadio2"
                            >Other</label
                          >
                        </div>
                      </div>

                      <div class="row">
                        <div class="col-md-6 mb-1 w-100">
                          <div data-mdb-input-init class="form-outline">
                            <input
                              name="password"
                              type="password"
                              id="myPassword"
                              class="form-control form-control-lg"
                              placeholder="Enter Password"
                              required
                            />
                            <!-- <label class="form-label" for="myPassword"
                              >Password</label
                            > -->
                          </div>
                        </div>
                      </div>

                      <div class="row">
                        <div class="mb-3 col-md-6">
                          <input
                            type="checkbox"
                            id="togglePassword"
                            onclick="showPassword()"
                          />
                          <label for="togglePassword" class="ms-1"
                            >Show Password</label
                          >
                        </div>
                      </div>

                      <div class="d-flex justify-content-end pt-3">
                        <button
                          type="button"
                          data-mdb-button-init
                          data-mdb-ripple-init
                          class="btn btn-light btn-lg"
                          onclick="reset()"
                        >
                          Reset all
                        </button>
                        <button
                        type="submit"
                          data-mdb-button-init
                          data-mdb-ripple-init
                          class="btn btn-warning btn-lg ms-2"
                        >
                          Submit form
                        </button>
                        
                      </div>
                    </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
    <!-- for password showing -->
    <script th:src="@{/Js/password.js}"></script>

    	<!-- for reset -->
	<script th:src="@{/Js/resetText.js}"></script>
  </body>
</html>
