<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::title}, ~{::section} )}">
<head>
<meta charset="UTF-8">
<title>Verify OTP</title>
</head>
<body>
	    <section class="min-vh-100 container-fluid pt-5 mt-5 pb-5" style="background-color: #565353">

        <div class="row justify-content-center align-item-center">

            <div class="m-5 col-10 col-md-6 col-lg-6 col-sm-10">
                <div class="p-5 card shadow-lg border-0 rounded-4">

                    <!-- error msg/success -->
                    <div th:if="${success}"
                        class="alert alert-success d-flex justify-content-between align-items-center">
                        <p th:text="${success}" class="mb-0"></p>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${error}" class="alert alert-danger d-flex justify-content-between align-items-center">
                        <p th:text="${error}" class="mb-0"></p>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/verifyOTP}" method="post">
                        <h1 class="text-center">OTP verification</h1>
                        <h2>we have send otp to ur email please check it..</h2>
                        <div class="form-group  mt-4">
                            <!--  <label for="email" class="form-label">Enter Registered Email</label> -->
                            <input name="otp" type="text" class="form-control" id="email" placeholder="Enter OTP"
                                required>
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-dark m-2">Verify
                                OTP</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </section>
	
</body>
</html>
