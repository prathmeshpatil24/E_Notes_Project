<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org"
	th:fragment="layout(title,content)">
<head>
<meta charset="ISO-8859-1" />
<title th:replace="${title}"></title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
	crossorigin="anonymous" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
	integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- SweetAlert2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- base page page css -->
<link th:href="@{/Css/style.css}" rel="stylesheet" />

<!-- index page css -->
<link th:href="@{/Css/indexStyle.css}" rel="stylesheet" />

<!-- home page css -->
 <link rel="stylesheet" th:href="@{/Css/homePage.css}">
 
 
 <!-- setting  page css -->
 <link rel="stylesheet" th:href="@{/Css/settingPage.css}">

<!-- view notes  page css -->
 <link rel="stylesheet" th:href="@{/Css/viewNotes.css}">



<link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top"
		aria-label="Main navigation">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">
				<i class="fas fa-book-open"></i>
				 <!-- <img class="" th:src="@{/img/logo.png}" alt="logo"> -->
				Enotes
				</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<!-- left block -->
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<th:block th:if="${user==NULL}">
						<li class="nav-item"><a class="nav-link active"
							aria-current="page" href="/"><i class="fa-solid fa-house"></i>
								Home</a></li>
					</th:block>

					<th:block th:if="${user!=NULL}">
						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/homePage}"><i class="fa-solid fa-house"></i>
								Home </a></li>

						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/addNotes}"><i class="fa-solid fa-plus"></i>
								Add </a></li>

						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/viewNotes}"><i class="fa-solid fa-list"></i>
								View</a></li>

						<!-- we need to create it -->
						<!--
						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/profile}"><i class="fa-solid fa-user"></i>
								Profile</a></li>  
						-->

						<li class="nav-item"><a class="nav-link"
							th:href="@{/user/setting}"><i class="fa-solid fa-gear"></i>
								Setting</a></li>
						<!-- we need to create it -->
					</th:block>
				</ul>
				<!-- left block -->

				<!-- right block -->
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<th:block th:if="${user==NULL}">
					<li class="nav-item custom-margine mx-4 "><a th:href="@{/about}"
							class="text-decoration-none text-white"> About</a></li>
						<li class="nav-item custom-margine"><a th:href="@{/register}"
							class="btn btn-sm btn-primary"><i
								class="fa-solid fa-user-plus"></i> Register</a></li>
						<li class="nav-item custom-margine"><a th:href="@{/signin}"
							class="btn btn-sm btn-primary ms-2"><i
								class="fa-solid fa-right-to-bracket"></i> Login</a></li>
					</th:block>

					<th:block th:if="${user!=NULL}">
						<li class="nav-item custom-margine">
						   <a th:href="@{/user/profile}"
							class="nav-link">
							  <i class="fa-solid fa-user"></i> 
							       [[${user.name}]]
							</a>
					   </li>
						<li class="nav-item custom-margine"><a th:href="@{/logout}"
							class="btn btn-sm btn-primary ms-2"><i
								class="fa-solid fa-right-to-bracket"></i> Logout</a></li>
					</th:block>
				</ul>
				<!-- right block -->
			</div>
		</div>
	</nav>

	<div th:replace="${content}"></div>

	<!-- Footer -->
	<footer class="bg-dark text-white py-4">
		<div class="container text-center">
			<p class="mb-0">&copy; 2025 E-Notes. All rights reserved.</p>
		</div>
	</footer>

	<!-- login page password showing  -->
	<script th:src="@{/Js/password.js}"></script>
	<!-- for reset -->
	<script th:src="@{/Js/resetText.js}"></script>
	
	<!-- for setting page -->
	<script th:src="@{/Js/setting.js}"></script>
	
	<!-- for delete sweer alert in view notes page -->
	<script th:src="@{/Js/sweetAlert.js}"></script>
	
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
</body>
</html>
