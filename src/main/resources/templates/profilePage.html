<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::title}, ~{::section})}">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

<style>
body {
	background-color: #f4f6f9;
	font-family: 'Segoe UI', sans-serif;
}

.profile-card {
	background-color: #ffffff;
	border-radius: 10px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
	max-width: 300px;
	margin: 20px auto;
	overflow: hidden;
	font-family: 'Arial', sans-serif;
}

.profile-header {
	background-color: #007bff;
	color: #ffffff;
	padding: 15px;
	text-align: center;
}

.profile-header h2 {
	margin: 0;
	font-size: 1.5em;
}

.profile-body {
	padding: 20px;
}

.profile-info {
	margin-bottom: 15px;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.info-label {
	font-weight: bold;
	color: #333333;
}

.info-value {
	color: #555555;
	text-align: right;
}
</style>
</head>
<body>
	<section>
		<div class="profile-container">
			<h1 class="profile-header text-center">
				Welcome, <span th:text="${name}"></span>!
			</h1>
			<div class="profile-card">
				<div class="profile-header">
					<h2>User Profile</h2>
				</div>
				<div class="profile-body">
					<div class="profile-info">
						<span class="info-label">User ID:</span> <span class="info-value"
							th:text="${userID}"></span>
					</div>
					<div class="profile-info">
						<span class="info-label">Email:</span> <span class="info-value"
							th:text="${email}"></span>
					</div>
					<div class="profile-info">
						<span class="info-label">Gender:</span> <span class="info-value"
							th:text="${gender}"></span>
					</div>
					<div class="profile-info">
						<span class="info-label">Address:</span> <span class="info-value"
							th:text="${address}"></span>
					</div>
				</div>
			</div>

			<!-- Button trigger modal -->
			<div style="text-align: center; margin-top: 20px;">
				<button type="button" class="btn btn-success" data-bs-toggle="modal"
					data-bs-target="#updateProfileModal">Update Profile</button>
			</div>
		</div>

		<!-- Modal -->
		<div class="modal fade" id="updateProfileModal" tabindex="-1"
			aria-labelledby="updateProfileModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="updateProfileModalLabel">Update
							Profile</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>
					<div class="modal-body">

						<form id="updateForm" th:action="@{/user/update-profile}" method="post">
							<div th:if="${success}" class="alert alert-success" role="alert">
								<span th:text="${success}"></span>
							</div>
							<div th:if="${error}" class="alert alert-danger" role="alert">
								<span th:text="${error}"></span>
							</div>

							<div class="form-group">
								<input type="hidden" name="id" th:value="${id}"> <label>Name:</label>
								<input type="text" name="name" th:value="${name}"
									class="form-control">
							</div>
							<div class="form-group">
								<label>Email:</label> <input type="email" name="email"
									th:value="${email}" class="form-control">
							</div>
							<div class="form-group">
								<label>Gender:</label> <input type="text" name="gender"
									th:value="${gender}" class="form-control">
							</div>
							<div class="form-group">
								<label>Address:</label> <input type="text" name="address"
									th:value="${address}" class="form-control">
							</div>
							
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Close</button>
						<button type="submit" form="updateForm" class="btn btn-primary">Save
							changes</button>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>
</html>
