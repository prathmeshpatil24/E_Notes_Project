<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::title}, ~{::section})}">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">


</head>
<body>
	<section>
		<div class="min-vh-100 container-fluid pt-5 mt-5 pb-5"
			style="background-color: #565353">
			<div class="row m-4 d-flex justify-content-center">
				<!-- success /error msg -->
				<div class=" d-flex justify-content-center">
					<div th:if="${success}" class="alert alert-success text-center"
						role="alert" style="width: 400px;">
						<p th:text="${success}">updated</p>
					</div>
				</div>
				'

				<div class=" d-flex justify-content-center">
					<div th:if="${error}" class="alert alert-danger mb-2 text-center"
						role="alert" style="width: 400px;">
						<p th:text="${error}"></p>
					</div>
				</div>



				<!-- profile  -->
				<div class="col-lg-8 col-sm-10 col-md-8">
					<div class="card mb-4 rounded-4">
						<div class="card-body text-center">
							<div class="row d-flex justify-content-center">
								<!-- left -->
								<div class="col-md-6 col-sm-6 col-10 p-3">
									<img th:if="${gender== 'Male'}" th:src="@{/img/man.png}"
										alt=" men avatar" class="rounded-circle img-fluid bg-dark"
										style="width: 150px" /> <img
										th:if="${gender == 'Female'}" th:src="@{/img/woman.png}"
										alt=" men avatar" class="rounded-circle img-fluid bg-dark"
										style="width: 150px" />
								</div>

								<!-- right -->
								<div class="col-md-6 col-sm-6 col-10 d-flex-row">
									<h5 class="my-3" th:text="${name}">John Smith</h5>
									<p class="text-muted mb-1">Premium Member</p>
									<p class="text-muted mb-4" th:text="${address}">San
										Francisco, CA</p>
									<div class="d-flex justify-content-center mb-2">
										<button type="button" class="btn btn-md btn-dark"
											data-bs-toggle="modal" data-bs-target="#updateProfileModal">
											Edit Profile</button>
									</div>

									<!-- Modal -->
									<div class="modal fade" id="updateProfileModal" tabindex="-1"
										aria-labelledby="updateProfileModalLabel" aria-hidden="true">
										<div class="modal-dialog">
											<div class="modal-content">
												<div class="modal-header">
													<h5 class="modal-title" id="updateProfileModalLabel">Update
														Profile</h5>
													<button type="button" class="btn-close"
														data-bs-dismiss="modal" aria-label="Close"></button>
												</div>
												<div class="modal-body">

													<form id="updateForm" th:action="@{/user/update-profile}"
														method="post">
														<div th:if="${success}" class="alert alert-success"
															role="alert">
															<span th:text="${success}"></span>
														</div>
														<div th:if="${error}" class="alert alert-danger"
															role="alert">
															<span th:text="${error}"></span>
														</div>

														<div class="form-group">
															<input type="hidden" name="id" th:value="${id}">
															<label>Name:</label> <input type="text" name="name"
																th:value="${name}" class="form-control">
														</div>
														<div class="form-group">
															<label>Email:</label> <input type="email" name="email"
																th:value="${email}" class="form-control">
														</div>
														<div class="form-group">
															<label>Gender:</label> <input type="text" name="gender"
																th:value="${gender}" class="form-control">
														</div>
														<div class="form-group">
															<label>Address:</label> <input type="text" name="address"
																th:value="${address}" class="form-control">
														</div>

													</form>
												</div>
												<div class="modal-footer">
													<button type="button" class="btn btn-secondary"
														data-bs-dismiss="modal">Close</button>
													<button type="submit" form="updateForm"
														class="btn btn-primary">Save changes</button>
												</div>
											</div>
										</div>
									</div>

								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- profile data -->
				<div class="col-lg-8 col-sm-10 col-md-8">
					<div class="card mb-4 rounded-4">
						<div class="card-body">
							<div class="row p-2 text-center">
								<div class="col-sm-3">
									<p class="mb-0">Full Name</p>
								</div>
								<div class="col-sm-9">
									<p class="text-muted mb-0" th:text="${name}">John Smith</p>
								</div>
							</div>
							<hr />
							<div class="row p-2 text-center">
								<div class="col-sm-3">
									<p class="mb-0">Email</p>
								</div>
								<div class="col-sm-9">
									<p class="text-muted mb-0" th:text="${email}">
										john@example.com</p>
								</div>
							</div>
							<hr />

							<div class="row p-2 text-center">
								<div class="col-sm-3">
									<p class="mb-0">Address</p>
								</div>
								<div class="col-sm-9">
									<p class="text-muted mb-0" th:text="${address}">San
										Francisco, CA</p>
								</div>
							</div>
							<hr />

							<!-- need to be implemented -->
							<div class="row p-2 text-center">
								<div class="col-sm-3">
									<p class="mb-0">Member Since</p>
								</div>
								<div class="col-sm-9">
									<p class="text-muted mb-0">Jan 15, 2022</p>
								</div>
							</div>
							<!--  -->


							<hr />
							<div class="row p-2 text-center">
								<div class="col-sm-3">
									<p class="mb-0">Notes Count</p>
								</div>
								<div class="col-sm-9">
									<p class="text-muted mb-0" th:text="${totalNotes}">127</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>
</html>
