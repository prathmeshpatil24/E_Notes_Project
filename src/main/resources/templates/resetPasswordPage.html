<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::title}, ~{::section} )}">

<head>
	<meta charset="UTF-8">
	<title>Reset Password</title>
</head>

<body>
	<section class="min-vh-100 container-fluid pt-5 mt-5 pb-5" style="background-color: #565353">

		<div class="row d-flex justify-content-center align-item-center">
			<div class="m-5 col-10 col-md-6 col-lg-6 col-sm-10">
				<div class="card shadow-lg border-0 rounded-4">
					<!-- card header -->
					<div class="card-header p-4 text-dark text-center rounded-top-4">
						<h1 class="text-center">Reset Your Password</h1>
					</div>


					<!-- Display success message if 'success' attribute is present -->
					<div class="card-body p-4">
						<div th:if="${success}"
							class="alert alert-success d-flex justify-content-between align-items-center">
							<p th:text="${success}" class="mb-0"></p>
							<p class="text-center">
								<a th:href="@{/signin}">Click here to login</a>
							</p>
							<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
						</div>


						<!-- Display error message if 'error' attribute is present -->
						<div th:if="${error}"
							class="alert alert-danger d-flex justify-content-between align-items-center" role="alert">
							<p th:text="${error}" class="mb-0">Error</p>
							<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
						</div>

						<form th:action="@{/resetPassword}" method="post">
							<!-- Hidden Email Field -->
							<input type="hidden" name="email" th:value="${email}">

							<!-- New Password Field -->
							<div class="form-group mt-4">
								<label for="newPassword">New Password</label> <input name="newPassword" type="password"
									class="form-control" id="newPassword" placeholder="Enter New Password" required>
							</div>



							<!-- Confirm Password Field -->
							<div class="form-group mt-4">
								<label for="confirmPassword">Confirm Password</label> <input name="confirmPassword"
									type="password" class="form-control" id="confirmPassword"
									placeholder="Confirm New Password" required>
							</div>

							<!-- Show Password Checkbox -->
							<div class="form-group mt-2">
								<input type="checkbox" id="showPassword"> Show Passwords
							</div>


							<!-- btn for reset -->
							<div class="text-center mt-4">
								<button type="submit" class="btn btn-dark">Reset
									Password</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
