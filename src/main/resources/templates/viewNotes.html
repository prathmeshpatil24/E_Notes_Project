<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{ base :: layout(~{::title}, ~{::section}) }">
<head>
<meta charset="ISO-8859-1">
<title>View Notes</title>
</head>
<body>
	<section>
		<div class="container-fluid p-2">
			<h4 class="text-center">View All Notes</h4>
			<div class="row">
				<div class="col-md-10 offset-md-1 mt-2">
					<!-- Check if there are no notes available -->
					<div th:if="${#lists.isEmpty(notesList)}">
						<div class="alert alert-warning text-center">
							<strong th:text="${noNotesMessage}">No notes available.</strong>
						</div>
					</div>

					<!-- Display total count of notes -->
					<div class="alert alert-info text-center mt-2">
						<strong>Total Notes: </strong><span th:text="${totalItems}"></span>
					</div>


					<!-- search function -->
					<div class="d-flex justify-content-center mb-4">
						<form th:action="@{/user/viewNotes}" method="get"
							class="d-flex align-items-center form-inline"
							style="max-width: 500px; width: 100%;">
							<!-- <div class="input-group input-group-md"> -->
								<input type="text" name="keyword"
									class="form-control mr-sm-2 rounded-start" th:value="${keyword}"
									placeholder="Search your notes..." style="max-width: 300px;">
								<input type="hidden" name="page" value="0" />
								<button class="btn btn-success mx-sm-2 mx-md-3 my-2 my-sm-0 rounded-end" type="submit">
									<i class="fa fa-search"></i>
								</button>
							<!-- </div> -->
						</form>
					</div>



					<!-- If there are notes, display them -->
					<div th:each="n : ${notesList}" class="card mt-2">
						<div class="card-body">
							<div class="text-center">
								<i class="fa-solid fa-book fa-2x"></i>
							</div>
							<div>
								<!-- for each loop -->
								<p>
									<strong>Title:</strong> <span th:text="${n.title}"></span>
								</p>
								<p>
									<strong>Content:</strong> <span th:text="${n.description}"></span>
								</p>
								<p>
									<strong>Created At:</strong> <span th:text="${n.localDate}"></span>
								</p>
								<p>
									<a th:if="${n.filePath}"
										th:href="@{viewNotes/downloadNoteFile/{id}(id=${n.id})}"
										target="_blank" th:text="${fileNames[n.id]}">Download</a> <span
										th:unless="${n.filePath}">No File</span>
								</p>
							</div>
							<div class="text-center">



								<a th:href="@{'editNotes/' + ${n.id}}"
									class="btn btn-primary btn-sm">Edit</a> <a
									th:href="@{'deleteNotes/'+${n.id}}"
									class="btn btn-danger btn-sm"
									onclick="return confirm('Are you sure you want to delete this note?')">Delete</a>
							</div>
						</div>
					</div>

					<!-- Pagination Controls (only display if there is data) -->
					<div th:if="${not #lists.isEmpty(notesList)}">
						<nav aria-label="Page navigation" class="mt-3">
							<ul class="pagination justify-content-center">

								<li class="page-item"
									th:classappend="${currentPage == 0} ? 'disabled'"><a
									class="page-link"
									th:href="@{/user/viewNotes(page=${currentPage - 1},
									keyword=${keyword})}"
									aria-label="Previous"> <span aria-hidden="true">&laquo;
											Previous</span>
								</a></li>

								<!-- dynamically generate page number -->
								<li class="page-item"
									th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
									th:classappend="${i == currentPage} ? 'active'"><a
									class="page-link"
									th:href="@{/user/viewNotes(page=${i},
									keyword=${keyword})}"
									th:text="${i + 1}"> </a></li>

								<li class="page-item"
									th:classappend="${currentPage +1 == totalPages} ? 'disabled'">
									<a class="page-link"
									th:href="@{/user/viewNotes(page=${currentPage+1},
									keyword=${keyword})}"
									aria-label="Next"> <span aria-hidden="true">Next
											&raquo;</span>
								</a>
								</li>
							</ul>
						</nav>
					</div>
				</div>
			</div>
	</section>

	<
</body>
</html>
