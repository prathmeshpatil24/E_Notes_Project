<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{ base :: layout(~{::title}, ~{::section}) }"
>
  <head>
    <meta charset="ISO-8859-1" />
    <title>View Notes</title>
  </head>
  <body>
    <section
      class="min-vh-100 container-fluid pt-5 mt-5 pb-5"
      style="background-color: #565353"
    >
      <!-- Check if there are no notes available -->
      <div
        th:if="${#lists.isEmpty(notesList)}"
        class="d-flex justify-content-center"
      >
        <div
          class="alert alert-warning text-center alert-dismissible fade show"
          role="alert"
        >
          <strong th:text="${noNotesMessage}">No notes available</strong>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>
      </div>

      <div>
        <div
          th:if="${message}"
          class="alert alert-success alert-dismissible fade show"
          role="alert"
        >
          <span th:text="${message}"></span>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>
      </div>

	  <div class="container-fluid border-1 rounded-4 mb-5"  style="background-color: rgb(240, 243, 245)">
		<div class="row d-flex justify-content-center p-3">
		  <div class="col-10 col-sm-10 col-md-10">
			
			 
				  <div class="row d-flex justify-content-center mb-2">
					<div class="col-10 col-sm-10 col-md-10 pt-2">
					  <form th:action="@{/user/viewNotes}" method="get">
						<div class="input-group mb-3">
						  <input
							type="text"
							name="keyword"
							th:value="${keyword}"
							placeholder="Search notes..."
							class="form-control"
							required
						  />
						  <input type="hidden" name="page" value="0" />
						  <button class="btn btn-dark" type="button">
							<i class="fas fa-search"></i>
						  </button>
						</div>
					  </form>
					</div>
				  </div>
	  
				  <div class="d-flex justify-content-center">
					<div class="user-actions">
					  <div class="dropdown">
						<button
						  class="btn btn-sm btn-primary dropdown-toggle"
						  type="button"
						  id="dropdownMenuButton"
						  data-bs-toggle="dropdown"
						  aria-haspopup="true"
						  aria-expanded="false"
						>
						  <i class="fas fa-filter"></i> Filters
						</button>
						<div
						  class="dropdown-menu"
						  aria-labelledby="dropdownMenuButton"
						>
						  <a
							class="dropdown-item"
							th:href="@{/user/viewNotes(page=0, keyword=${keyword}, sort='asc')}"
							th:classappend="${sort == 'asc'} ? 'active'"
							>Ascending</a
						  >
						  <a
							class="dropdown-item"
							th:href="@{/user/viewNotes(page=0, keyword=${keyword}, sort='desc')}"
							th:classappend="${sort == 'desc'} ? 'active'"
							>Descending</a
						  >
	  
						  <!-- <a class="dropdown-item" href="#">Something else here</a> -->
						</div>
					  </div>
	  
					  <div>
						<a th:href="@{/user/addNotes}" class="btn btn-sm btn-dark">
						  <i class="fas fa-plus"></i> New Note
						</a>
					  </div>
					</div>
				  </div>
			   
		  
		  </div>
		</div>
	  </div>

      <main
        class="container-fluid rounded-4 p-3"
        style="background-color: rgb(240, 243, 245)"
      >
        <div class="notes-header">
          <h2 class="section-title">My Notes</h2>
          <div class="filter-options">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Recent</button>
            <button class="filter-btn">Favorites</button>

            <!-- <a
			th:href="@{/user/viewNotes(page=0, keyword=${keyword})}"
			class="btn btn-sm filter-btn"
			th:classappend="${filter == null or filter != 'recent' and filter != 'favorites'} ? 'btn-dark' : 'btn-outline-dark'"
		  >
			All
		  </a>
		  <a
			th:href="@{/user/viewNotes(page=0, keyword=${keyword}, filter='recent')}"
			class="btn btn-sm filter-btn ms-2"
			th:classappend="${filter == 'recent'} ? 'btn-dark' : 'btn-outline-dark'"
		  >
			Recent
		  </a>
		  <a
			th:href="@{/user/viewNotes(page=0, keyword=${keyword}, filter='favorites')}"
			class="btn btn-sm filter-btn ms-2"
			th:classappend="${filter == 'favorites'} ? 'btn-dark' : 'btn-outline-dark'"
		  >
			Favorites
		  </a> -->
          </div>
        </div>
        <hr />

        <!-- If there are notes, display them -->
        <div class="container">
          <div class="row d-flex justify-content-center">
            <div class="col-8">
              <div th:each="n : ${notesList}" class="card mt-2">
                <div class="card-header d-flex justify-content-between">
                  <div class="pt-1 font-weight-bolder">
                    <h5 th:text="${n.title}" class="font-weight-bolder">
                      Project Titel
                    </h5>
                  </div>
                  <div class="p-1">
                    <button class="action-btn ms-1">
                      <i class="fas fa-star"></i>
                    </button>
                    <a
                      th:href="@{'editNotes/' + ${n.id}}"
                      class="action-btn ms-1"
                      ><i class="fas fa-edit fa-1x"></i
                    ></a>
                    <!-- <a
                      th:href="@{'deleteNotes/'+${n.id}}"
                      class="action-btn ms-1"
                      ><i class="fas fa-trash fa-1x"></i
                    ></a> -->
					<!-- sweet alert -->
					<a href="#" class="action-btn ms-1" th:onclick="'confirmDelete(' + ${n.id} + ')'">
						<i class="fas fa-trash fa-1x"></i>
					  </a>
					  
                  </div>
                </div>
                <div class="card-body">
                  <div>
                    <!-- for each loop -->

                    <p>
                      <strong>Content:</strong>
                      <span th:text="${n.description}"></span>
                    </p>

                    <p>
                      <a
                        th:if="${n.filePath}"
                        th:href="@{viewNotes/downloadNoteFile/{id}(id=${n.id})}"
                        target="_blank"
                        th:text="${fileNames[n.id]}"
                        >Download</a
                      >
                      <span th:unless="${n.filePath}">No File</span>
                    </p>
                  </div>
                </div>
                <div
                  class="card-footer font-weight-light font-weight-lighter text-secondary d-flex justify-content-between"
                >
                  <div>
                    Created: <span th:text="${n.localDate}"> 2 days ago</span>
                  </div>
                  <div>
                    <span class="tag">Personal</span>
                    <!-- <span class="tag">Urgent</span> -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty state (hidden by default) -->
        <!-- <div class="empty-state">
			  <i class="far fa-clipboard"></i>
			  <h3>No Notes Found</h3>
			  <p>You don't have any notes yet. Create your first note to get started!</p>
			  <button class="btn btn-primary">
				  <i class="fas fa-plus"></i>
				  Create Note
			  </button>
		  </div> -->
      </main>

      <!-- Pagination Controls (only display if there is data) -->
      <div class="mt-5">
		<div th:if="${not #lists.isEmpty(notesList)}">
			<nav aria-label="Page navigation" class="mt-3">
			  <ul class="pagination justify-content-center">
				<li
				  class="page-item"
				  th:classappend="${currentPage == 0} ? 'disabled'"
				>
				  <a
					class="page-link"
					th:href="@{/user/viewNotes(page=${currentPage - 1},
									  keyword=${keyword},sort=${sort})}"
					aria-label="Previous"
				  >
					<span aria-hidden="true">&laquo; Previous</span>
				  </a>
				</li>
	
				<!-- dynamically generate page number -->
				<li
				  class="page-item"
				  th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
				  th:classappend="${i == currentPage} ? 'active'"
				>
				  <a
					class="page-link"
					th:href="@{/user/viewNotes(page=${i},
									   keyword=${keyword},sort=${sort})}"
					th:text="${i + 1}"
					>1
				  </a>
				</li>
	
				<li
				  class="page-item"
				  th:classappend="${currentPage +1 == totalPages} ? 'disabled'"
				>
				  <a
					class="page-link"
					th:href="@{/user/viewNotes(page=${currentPage+1},
									  keyword=${keyword},sort=${sort})}"
					aria-label="Next"
				  >
					<span aria-hidden="true">Next &raquo;</span>
				  </a>
				</li>
			  </ul>
			</nav>
		  </div>
	  </div>
    </section>
    
    	<!-- for delete sweer alert in view notes page -->
	<script th:src="@{/Js/sweetAlert.js}"></script>
  </body>
</html>
