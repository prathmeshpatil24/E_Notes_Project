<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org"
	th:replace="~{ base :: layout(~{::title} , ~{::section} ) }">
<head>
<meta charset="ISO-8859-1">
<title>Add Notes Page</title>
</head>
<body>
	<section class="min-vh-100 container-fluid pt-5 mt-5 pb-5"
	style="background-color: #565353">
	  
		<div class="row justify-content-center">
		  <div class=" col-10 col-md-10 col-lg-10 col-sm-10">
			<div class="card shadow-lg border-0 rounded-4">
			  <div class="card-header text-white text-center rounded-top-4"
			  style="background-color: rgb(45, 46, 46);">
				<h3 class="m-3">📝 Add Your Notes</h3>
			  </div>
	
			  <div class="card-body p-4">
				<!-- Flash message -->
				<th:block th:if="${session.msg}">
				  <div class="alert alert-success text-center mb-4" role="alert">
					[[${session.msg}]]
				  </div>
				  <th:block th:text="${@userServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>
	
				<!-- Form -->
				<form th:action="@{/user/saveNotes}" method="post" enctype="multipart/form-data">
				  <!-- Title -->
				  <div class="mb-4">
					<label class="form-label fw-semibold">Title</label>
					<input type="text" name="title" class="form-control shadow-sm" placeholder="Enter note title" required />
				  </div>
	
				  <!-- Description -->
				  <div class="mb-4">
					<label class="form-label fw-semibold">Description</label>
					<textarea name="description" rows="6" class="form-control shadow-sm" placeholder="Write your notes here..." required></textarea>
				  </div>
	
				  <!-- File Upload -->
				  <div class="mb-4">
					<label class="form-label fw-semibold">Optional File Upload</label>
					<input type="file" name="file" class="form-control shadow-sm" />
				  </div>
	
				  <!-- Submit Button -->
				  <div class="d-flex justify-content-md-end justify-content-center">
					<button type="submit" class=" btn btn-dark btn-lg shadow rounded-pill">
					  <i class="fas fa-save me-2"></i>Save Note
					</button>
  
					<button type="reset" class="btn btn-dark btn-lg shadow rounded-pill ms-2">
					  <i class="fas fa-eraser me-2"></i>Clear
					</button>
				  </div>
				</form>
			  </div>
	
			  <div class="card-footer text-muted text-center small py-2">
				You can view, edit, or delete your notes later.
			  </div>
			</div>
		  </div>
		</div>
	</section>
</body>
</html>
